name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      type:
        description: 'Release Type'
        required: true
        type: choice
        options:
          - release
          - beta

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install

      - name: Update Versions and Commit
        shell: bash
        run: |
          NEW_VER="${{ github.event.inputs.version }}"
          # Strip leading 'v' if user typed e.g. v1.0.0
          CLEAN_VER="${NEW_VER#v}"
          
          # Update root package.json
          if [ -f "package.json" ]; then
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='$CLEAN_VER'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
          fi
          
          # Update tauri.conf.json
          if [ -f "src-tauri/tauri.conf.json" ]; then
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); p.version='$CLEAN_VER'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2));"
          fi
          
          # Update Cargo.toml
          if [ -f "src-tauri/Cargo.toml" ]; then
            sed -i -e "s/^version = \".*\"/version = \"$CLEAN_VER\"/" src-tauri/Cargo.toml
          fi
          
          # Git commit and push
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          
          if git diff --staged --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: bump version to $CLEAN_VER"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: v${{ github.event.inputs.version }}-${{ github.event.inputs.type }}
          releaseName: 'Mixero v${{ github.event.inputs.version }} (${{ github.event.inputs.type }})'
          releaseBody: 'Automated release for Mixero audio mixer desktop application.'
          releaseDraft: false
          prerelease: ${{ github.event.inputs.type == 'beta' }}
